[workspace]
resolver = "3"
members = ["crates/gae-core", "crates/gae-engine", "envs/_template", "envs/soc-desk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MrFo2sh/gae"

[workspace.dependencies]
gae-core = { path = "crates/gae-core" }
gae-engine = { path = "crates/gae-engine" }
# Pinned to the versions agent-globe builds with: a mismatch between bevy and bevy_egui does not compile.
bevy = { version = "0.20", features = ["wav"] }
bevy_egui = "0.43"
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
tiny_http = "0.12"
anyhow = "1"
thiserror = "2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
rodio = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
